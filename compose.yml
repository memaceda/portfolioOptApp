services:
  nextapp:
    container_name: nextapp
    image: nextapp:1.0.0
    build:
      context: ./frontend
      dockerfile: next.dockerfile
    ports:
      - 3000:3000
    volumes:
      - ./frontend/public:/app/public
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - flaskapp

  flaskapp:
    container_name: flaskapp
    image: flaskapp:1.0.0
    build:
      context: ./backend
      dockerfile: flask.dockerfile
    ports:
      - 4000:4000
    volumes:
      - ./backend/InputData:/app/InputData
      - ./backend/OceanPortfolioOptimization:/app/OceanPortfolioOptimization
      - ./backend/OutputData:/app/OutputData
      - ./gurobi.lic:/root/gurobi.lic
    environment:
      - hsds_endpoint=https://developer.nrel.gov/api/hsds
      - H5SERV_ENDPOINT=https://developer.nrel.gov/api/hsds
      - hs_api_key=N4K0MbpR1xdbev9HMX6cYpQesal7KcNDtA7oIfz2
      - hs_bucket=nrel-pds-hsds
      - GRB_LICENSE_FILE=/root/gurobi.lic
